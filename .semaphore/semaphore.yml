---
version: v1.0
name: UPM
agent:
  machine:
    type: s1-goval-nixos

global_job_config:
  env_vars:
    - name: UPM_CI
      value: "1"
  prologue:
    commands:
      - checkout
      - git switch --detach
      - eval "$(nix print-dev-env)"

blocks:
  - name: test
    dependencies: [ ]
    task:
      jobs:
        - name: test-suite
          commands:
            - nix build .#go2nix-nix .#go2nix-nix-plugin --no-link
            - export GO2NIX_NIX="$(nix eval --raw .#go2nix-nix.outPath)/bin/nix"
            - export GO2NIX_PLUGIN="$(nix eval --raw .#go2nix-nix-plugin.outPath)/lib/nix/plugins/libgo2nix_plugin.so"
            - export GOMODCACHE="$(mktemp -d)"
            - go mod download
            - export PATH="$($GO2NIX_NIX build . --no-link --print-out-paths --option allow-import-from-derivation true --option plugin-files \"$GO2NIX_PLUGIN\")/bin:$PATH"
            - make test-suite
      epilogue:
        commands:
          - test-results publish junit.xml

  - name: lint
    dependencies: [ ]
    task:
      jobs:
        - name: golang lint
          commands:
            - make generated
            - golangci-lint run

after_pipeline:
  task:
    jobs:
      - name: Publish Results
        commands:
          - test-results gen-pipeline-report
