name: Compare UPM builders
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/compare-builders.yml'
      - 'nix/upm/**'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        package: [upm, upm-drvgo]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            extra-experimental-features = ca-derivations dynamic-derivations recursive-nix
            extra-system-features = recursive-nix ca-derivations
      - name: Time complete packages and check behavior
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          probe=$(mktemp -d)
          echo 'import requests' > "$probe/main.py"
          for scenario in initial cli-edit unchanged; do
            if [[ $scenario == cli-edit ]]; then
              sed -i 's/display command version/display the command version/' internal/cli/cli.go
              git diff --quiet && exit 1
            fi
            start=$(date +%s%3N)
            out=$(nix build ".#$PACKAGE" --no-link --print-out-paths)
            elapsed=$(( $(date +%s%3N) - start ))
            echo "$PACKAGE $scenario: $elapsed ms" | tee -a "$GITHUB_STEP_SUMMARY"
            version=dirty
            if [[ $scenario == initial ]]; then version=$(git rev-parse --short=7 HEAD); fi
            test "$("$out/bin/upm" --version)" = "upm 0.0.0-$version"
            test -s "$out/pypi_map.sqlite"
            test "$(cd "$probe" && "$out/bin/upm" --lang python3-pip guess --all)" = requests
            if [[ $scenario != initial ]]; then "$out/bin/upm" --help | grep 'display the command version'; fi
          done
